name: Upstream Sync

# Eurth fork: merges upstream UptimeFlare into main instead of replacing every file.
# The original workflow deleted everything except uptime.config.ts, which would undo
# the worker rename, logo, favicon and the Eurth theme (styles/eurth.css).
# Monitor history lives in the Cloudflare D1 database and is never touched by this.

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      override-token:
        description: '[Optional] Paste a PAT here. If left blank, PAT_TOKEN secret will be used (if set). Needed when upstream changes files under .github/workflows, more info at https://github.com/lyc8503/UptimeFlare/wiki/Synchronize-updates-from-upstream#upgrade-methods'
        required: false

jobs:
  sync_latest_from_upstream:
    name: Merge latest commits from upstream repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ inputs.override-token || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Merge upstream changes
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/lyc8503/UptimeFlare.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          if ! git merge --no-ff upstream/main -m "Merge latest UptimeFlare upstream"; then
            git merge --abort
            echo "::error::Upstream changes conflict with Eurth customisations. Merge upstream/main by hand in a pull request."
            exit 1
          fi
          git push
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deployment
        if: ${{ steps.sync.outputs.merged == 'true' && inputs.override-token == '' }}
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy.yml
